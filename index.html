<!DOCTYPE html>
<html lang="de">
    <head>
        <title>RSG Minecraft</title>
        <link rel="icon" type="image/png" size="32x32" href="./src/images/flavicon.png">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./src/css/style.css">
        <link rel="stylesheet" href="./src/css/fonts.css">
        <link rel="stylesheet" href="./src/css/universal.css">
        <link rel="stylesheet" href="./src/css/navbar.css">
        <link rel="stylesheet" href="./src/css/colors.css">
    </head>
    <body>
        <div class="navbar">
            <p class="title">RSG - Minecraft</p>
            <a href="./www/construction.html">Forum</a>
            <a href="./www/construction.html">Galerie</a>
            <a href="https://minecraft.wiki/">Minecraft Wiki ↗</a>
            <div class="navbar-right">
                <a href="./www/index_en.html">DE</a>
                <a href="./www/login.html" id="login">Login</a>
                <a href="./www/account.html" id="user-button" class="hidden">null</a>
                <button id="logout-button" onclick="logOut()" class="hidden">⏻</button>
            </div>
        </div>

        <div class="main">
            <div class="first-row">
                <div class="base-block" id="infos">
                    <h3>INFOS</h3>
                    <div id="domain">
                        <p>Domain: join.rsg-minecraft.de</p>
                        <div class="tooltip">
                            <button onclick="copyIP()" onmouseout="outFunc()">
                                <span class="tooltiptext" id="copyIP-tooltip">In der Zwischenablage speichern</span>
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    width="16" height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="#ffffff"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="8" y="8" width="13" height="13" rx="2"/>
                                    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <p>Status: <span id="server-status" class="server-status-dot unknown"></span></p>
                    <p>Version: <span id="server-version"></span></p>
                    <p>Seed: 978</p>
                    <p>Online seit: 12.01.2023</p>
                </div>
                <div class="base-block" id="player-info">
                    <h3>Spieler</h3>
                    <p><span id="playersOnline"></span> / <span id="playersMax"></span></p>
                    <a href="./www/playerList.html">→</a>
                </div>
            </div>
                <div class="base-block" id="map">
                    <a href="https://join.rsg-minecraft.de"><h3 id="map-title">MAP↗</h3></a>
                    <div class="map-iframe">
                        <iframe src="https://join.rsg-minecraft.de" scrolling="no"></iframe>
                    </div>
                </div>
        </div>

        <div class="credits-container">
            <a href="https://github.com/emdeby" class="credits">created by emdeby</a>
        </div>

        <script>
            function copyIP() {
                navigator.clipboard.writeText("join.rsg-minecraft.de")
                var tooltip = document.getElementById("copyIP-tooltip");
                tooltip.innerHTML = "Kopiert!";
            }

            function outFunc() {
                var tooltip = document.getElementById("copyIP-tooltip");
                tooltip.innerHTML = "In der Zwischenablage speichern";
            }
        </script>

        <script src="./scripts/server-stats.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./scripts/supabase.js"></script>
        <script src="./scripts/check-auth.js"></script>
        <script src="./scripts/logout.js"></script>
    </body>
</html>
