<!DOCTYPE html>
<html lang="de">
<html>
    <head>
        <title>RSG Minecraft</title>
        <link rel="icon" type="image/png" size="32x32" href="./src/images/flavicon.png">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./src/css/style.css">
        <link rel="stylesheet" href="./src/css/fonts.css">
        <link rel="stylesheet" href="./src/css/universal.css">
    </head>
    <body>
        <div class="topbar">
            <p class="title">RSG - Minecraft</p>
            <a href="./www/construction.html">Forum</a>
            <a href="./www/construction.html">Galerie</a>
            <a href="https://minecraft.wiki/">Minecraft Wiki ↗</a>
            <a href="./www/construction.html" class="login">Login</a>
        </div>

        <div class="main">
            <div class="first-row">
                <div class="infos">
                    <h3>INFOS</h3>
                    <div class="domain">
                        <p>Domain: join.rsg-minecraft.de</p>
                        <button onclick="copyIP()">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                width="16" height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#ffffff"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect x="8" y="8" width="13" height="13" rx="2"/>
                                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
                            </svg>
                        </button>
                    </div>
                    <p>Status: <span id="server-status" class="server-status-dot unknown"></span></p>
                    <p>Version: <span id="server-version"></span></p>
                    <p>Seed: 978</p>
                    <p>Online seit: 12.01.2023</p>
                </div>
                <div class="player-info">
                    <h3>Spieler:</h3>
                    <p><span id="playersOnline"></span> / <span id="playersMax"></span></p>
                    <a href="./www/playerList.html">Spieleliste →</a>
                </div>
            </div>
                <div class="map">
                    <h3>MAP</h3>
                    <div class="map-iframe">
                        <iframe src="https://mcseedmap.net/26.3.0-Java/978" scrolling="no"></iframe>
                    </div>
                </div>
        </div>

        <div class="credits-container">
            <a href="https://github.com/emdeby" class="credits">created by emdeby</a>
        </div>

        <script>
            function copyIP() {
                navigator.clipboard.writeText("join.rsg-minecraft.de")
            }
        </script>

        <script src="./scripts/server-stats.js"></script>
    </body>
</html>
