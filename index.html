<html>
    <head>
        <title>RSG Minecraft</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./src/css/style.css">
        <link rel="stylesheet" href="./src/css/fonts.css">
    </head>
    <body>
        <p class="topbar">RSG - Minecraft</p>

        <div class="main">
                <div class="infos">
                    <h3>INFOS</h3>
                    <div class="domain">
                        <p>Domain: join.rsg-minecraft.de</p>
                        <button onclick="copyIP()">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                width="16" height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#ffffff"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round">
                                <rect x="8" y="8" width="13" height="13" rx="2"/>
                                <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
                            </svg>
                        </button>
                    </div>
                    <p>Version: 26.3</p>
                    <p>Seed: 978</p>
                </div>
                <div class="map">
                    <h3>MAP</h3>
                    <div class="map-iframe">
                        <iframe src="https://mcseedmap.net/26.3.0-Java/978" scrolling="no"></iframe>
                    </div>
                </div>
        </div>

        <script>
            function copyIP() {
                navigator.clipboard.writeText("join.rsg-minecraft.de")
            }
        </script>
    </body>
</html>
